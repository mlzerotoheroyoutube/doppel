# Copy to .github/workflows/receipts.yml in any repo you want Receipts to guard.
# Add two repository secrets first (Settings -> Secrets and variables -> Actions):
#   MODEL_API_KEY  (Meta Model API)     SUBQ_API_KEY  (SubQ)
# Every pull request then gets a "Receipts" check: red on BLOCK, green otherwise,
# with the full report card on the run's summary page.
name: Receipts
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Receipts
        run: pip install "git+https://github.com/mlzerotoheroyoutube/doppel@main"
      - name: Verify this pull request
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          SUBQ_API_KEY: ${{ secrets.SUBQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m receipts verify --github-pr "${{ github.event.pull_request.html_url }}" --gate
